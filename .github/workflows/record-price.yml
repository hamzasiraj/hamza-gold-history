name: Record gold/silver/USD-PKR prices

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may occasionally delay this on the free tier)
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Record current prices
        run: node scripts/record.mjs

      - name: Commit updated history
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/price-history.json
          git diff --quiet --cached || git commit -m "Record prices $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
